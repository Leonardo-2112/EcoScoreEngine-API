spring.application.name=EcoScoreEngine-API

# Porta: o Render/Railway informam a porta pela variavel PORT
server.port=${PORT:8080}

# Banco Oracle - credenciais SEMPRE por variavel de ambiente (nunca no codigo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Pool pequeno: o Oracle da FIAP limita conexoes simultaneas por usuario
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=EcoScorePool

# Origens liberadas no CORS (ex.: https://ecoscore.vercel.app,http://localhost:5173)
app.cors.origins=${CORS_ORIGINS:*}

# Respostas JSON
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=false
server.error.include-message=always
